name: Update publications from Google Scholar

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-scholar:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install scholarly

      - name: Run scraper
        run: python scripts/update_scholar.py

      - name: Commit updated publications.html
        run: |
          if [[ -n "$(git status --porcelain publications.html)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add publications.html
            git commit -m "Auto-update publications from Google Scholar"
            git push
          else
            echo "No changes to publications.html."
          fi
